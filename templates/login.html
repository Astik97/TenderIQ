<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    
    <title>Login</title> 
</head>
<body>

<h2>Login</h2>

<form method="POST">
    <input type="email"
           name="email"
           placeholder="Email"
           required>
    <br><br>

    <input type="password"
           name="password"
           placeholder="Password"
           required>
    <br><br>

    <button type="submit">
        Login
    </button>

</form>

</body>
</html>
