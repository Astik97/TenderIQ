<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | TenderIQ</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="auth-container">

    <div class="auth-card">

        <h1>

            Welcome Back

        </h1>

        <p>

            Login to your TenderIQ account

        </p>

        <form
            method="POST"
            id="loginForm">

            <div class="input-group">

                <label>

                    Email Address

                </label>

                <input
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    required>

            </div>

            <div class="input-group">

                <label>

                    Password

                </label>

                <div class="password-box">

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required>

                    <span
                        class="toggle-password"
                        onclick="togglePassword('password', this)">

                        👁

                    </span>

                </div>

            </div>

            <div class="form-options">

                <label>

                    <input
                        type="checkbox"
                        name="remember">

                    Remember Me

                </label>

                <a href="/forgot-password">

                    Forgot Password?

                </a>

            </div>

            <button
                type="submit"
                class="btn btn-primary">

                Login

            </button>

        </form>

        <div class="auth-footer">

            Don't have an account?

            <a href="/register">

                Register

            </a>

        </div>

        <div class="home-link">

            <a href="/">

                ← Back to Home

            </a>

        </div>

    </div>

</div>

<script src="{{ url_for('static', filename='js/scripts.js') }}">
</script>

</body>

</html>
