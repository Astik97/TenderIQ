<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Comparison Report | TenderIQ</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/compare.css') }}">

</head>

<body>

<div class="container">

    <div class="header">

        <h1>Comparison Report</h1>

        <p>
            AI-Powered Tender Comparison Result
        </p>

    </div>

    <div class="summary-card">

        <div class="info-box">

            <h3>Tender 1</h3>

            <p>ID : {{ tender1 }}</p>

        </div>

        <div class="info-box">

            <h3>Tender 2</h3>

            <p>ID : {{ tender2 }}</p>

        </div>

    </div>

    <div class="similarity-card">

        <h2>Overall Similarity Score</h2>

        <div class="score-circle">

            {{ similarity }}%

        </div>

    </div>

    <div class="report-card">

        <h2>AI Analysis Report</h2>

        <pre>{{ report }}</pre>

    </div>

    <div class="buttons">

        <a href="/dashboard"
           class="btn">

            ← Back to Dashboard

        </a>

    </div>

</div>

<script src="{{ url_for('static', filename='js/compare.js') }}">
</script>

</body>

</html>
