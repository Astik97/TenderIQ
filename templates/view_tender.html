<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>View Tender | TenderIQ</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/view_tender.css') }}">

</head>

<body>

<div class="container">

    <header>

        <h1>📄 Tender Details</h1>

        <p>Review uploaded tender information</p>

    </header>

    <div class="card">

        <div class="info">

            <div>

                <label>Tender Name</label>

                <p>{{ tender[0] }}</p>

            </div>

            <div>

                <label>Stored File</label>

                <p>{{ tender[1] }}</p>

            </div>

            <div>

                <label>Upload Date</label>

                <p>{{ tender[3] }}</p>

            </div>

            <div>

                <label>File Type</label>

                <span class="badge">

                    {{ tender[1].split('.')[-1].upper() }}

                </span>

            </div>

        </div>

    </div>

    <div class="card">

        <div class="text-header">

            <h2>Extracted Tender Text</h2>

            <div>

                <button id="copyBtn">

                    📋 Copy

                </button>

                <button id="downloadBtn">

                    ⬇ Download

                </button>

            </div>

        </div>

        <textarea
            id="tenderText"
            readonly>{{ tender[2] }}</textarea>

        <div class="stats">

            <span id="wordCount"></span>

            <span id="charCount"></span>

        </div>

    </div>

    <div class="actions">

        <a href="/dashboard">

            <button>

                ← Back to Dashboard

            </button>

        </a>

    </div>

</div>

<div id="toast">

Copied Successfully!

</div>

<script src="{{ url_for('static', filename='js/view_tender.js') }}"></script>

</body>

</html>
